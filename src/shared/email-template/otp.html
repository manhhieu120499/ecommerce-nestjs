<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xác thực OTP</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f5f7fb;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 520px;
              background: #ffffff;
              border-radius: 16px;
              padding: 40px;
              box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            "
          >
            <tr>
              <td align="center">
                <h1 style="margin: 0 0 12px; font-size: 26px; color: #111827">
                  Xác thực tài khoản
                </h1>

                <p
                  style="
                    margin: 0;
                    color: #6b7280;
                    font-size: 15px;
                    line-height: 24px;
                  "
                >
                  Sử dụng mã OTP bên dưới để hoàn tất quá trình xác thực.
                </p>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding: 32px 0">
                <div
                  style="
                    background: #f3f4f6;
                    border-radius: 12px;
                    padding: 20px 28px;
                    font-size: 36px;
                    font-weight: 700;
                    letter-spacing: 10px;
                    color: #111827;
                  "
                >
                  {{OTP}}
                </div>
              </td>
            </tr>

            <tr>
              <td align="center">
                <p
                  style="
                    margin: 0;
                    font-size: 14px;
                    color: #6b7280;
                    line-height: 22px;
                  "
                >
                  Mã OTP có hiệu lực trong
                  <strong style="color: #111827">5 phút</strong>.
                </p>

                <p style="margin-top: 12px; font-size: 13px; color: #9ca3af">
                  Nếu bạn không thực hiện yêu cầu này, hãy bỏ qua email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
